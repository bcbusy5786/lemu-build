name: Build LEMU for Windows (UCRT64)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout LEMU source
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            binutils
            bison
            diffutils
            flex
            git
            grep
            make
            sed
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-libslirp

      - name: Show toolchain versions
        run: |
          gcc --version
          python --version
          ninja --version

      - name: Configure
        run: |
          mkdir -p build
          cd build
          ../configure \
            --target-list=mips64el-softmmu,mips64-softmmu,alpha-softmmu,i386-softmmu,ppc-softmmu,ppc64-softmmu \
            --enable-sdl \
            --enable-gtk \
            --enable-slirp \
            --disable-werror \
            --disable-tests \
            --disable-pie

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Collect runtime DLLs (Recursive, UCRT64)
        run: |
          cd build
          mkdir -p dist
          cp qemu-system-*.exe dist/ || true
          
          # 注意：UCRT64 的 DLL 路径是 /ucrt64/bin
          MINGW_BIN="/ucrt64/bin"
          touch processed_dlls.txt
          
          copy_deps() {
            local target="$1"
            objdump -p "$target" 2>/dev/null | grep "DLL Name:" | awk '{print $3}' | while read -r dll; do
              if grep -q "^${dll}$" processed_dlls.txt; then
                continue
              fi
              echo "$dll" >> processed_dlls.txt
              
              case "$dll" in
                KERNEL32.dll|ADVAPI32.dll|msvcrt.dll|USER32.dll|GDI32.dll|SHELL32.dll|ole32.dll|OLEAUT32.dll|WS2_32.dll|WINMM.dll|COMCTL32.dll|COMDLG32.dll|SHLWAPI.dll|UxTheme.dll|dwmapi.dll|SETUPAPI.dll|CRYPT32.dll|bcrypt.dll|d3d11.dll|dxgi.dll|DWrite.dll|dnsapi.dll|IPHLPAPI.dll|Secur32.dll|USERENV.dll|VERSION.dll|WINSPOOL.DRV|WLDAP32.dll|MPR.dll|NETAPI32.dll|ntdll.dll|PSAPI.dll|RPCRT4.dll|sechost.dll|ucrtbase.dll)
                  continue
                  ;;
              esac
              
              if [ -f "$MINGW_BIN/$dll" ]; then
                echo "Copying $dll..."
                cp "$MINGW_BIN/$dll" dist/ || true
                copy_deps "$MINGW_BIN/$dll"
              fi
            done
          }
          
          for exe in dist/qemu-system-*.exe; do
            [ -f "$exe" ] || continue
            echo "Processing $exe..."
            copy_deps "$exe"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lemu-windows-binaries
          path: build/dist/
          if-no-files-found: error
          retention-days: 30
